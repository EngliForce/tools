<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfabet Bingo</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-green: #39ff14;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px;
    }

    /* Achtergrond neon sfeerbollen */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 45vmax;
      height: 45vmax;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.7;
    }
    body::before {
      background: var(--neon-pink);
      top: -10%;
      left: -10%;
    }
    body::after {
      background: var(--neon-cyan);
      bottom: -10%;
      right: -10%;
    }

    /* Container Glassmorphism */
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                  0 0 15px rgba(0, 243, 255, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      max-height: 96vh;
      max-height: 96dvh;
    }

    h1 {
      font-size: clamp(1.8rem, 5vh, 2.6rem);
      margin-bottom: 12px;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-pink),
                   0 0 20px var(--neon-pink);
    }

    /* Bingo Grid 3x3 */
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      aspect-ratio: 1;
      margin-bottom: 16px;
    }

    /* Cell Styles */
    .cell {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.2rem, 7.5vh, 3.5rem);
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .cell:hover:not(.marked) {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px var(--neon-cyan);
      transform: scale(1.02);
    }

    /* Marked / Weggestreept */
    .cell.marked {
      background: rgba(57, 255, 20, 0.12);
      border-color: var(--neon-green);
      color: #fff;
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
    }

    /* Neon streep door de letter */
    .cell.marked::before {
      content: '';
      position: absolute;
      width: 85%;
      height: 4px;
      background-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
      transform: rotate(-20deg);
      border-radius: 2px;
    }

    /* Neon vinkje */
    .cell.marked::after {
      content: '✓';
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: clamp(0.7rem, 2vh, 1rem);
      color: var(--neon-green);
      text-shadow: 0 0 5px var(--neon-green);
    }

    /* Reset knop */
    .btn-new {
      background: transparent;
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      padding: clamp(10px, 2vh, 14px) 28px;
      font-size: clamp(0.9rem, 2vh, 1.05rem);
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn-new:hover {
      background: var(--neon-cyan);
      color: var(--bg-color);
      box-shadow: 0 0 20px var(--neon-cyan);
      text-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ALFABET BINGO</h1>
    <div class="bingo-grid" id="bingoGrid"></div>
    <button class="btn-new" onclick="generateAlphabetCard()">NIEUWE KAART</button>
  </div>

  <script>
    function generateAlphabetCard() {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';

      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const letters = [];

      // Genereer 9 unieke willekeurige letters
      while (letters.length < 9) {
        const randomIndex = Math.floor(Math.random() * alphabet.length);
        const letter = alphabet[randomIndex];
        if (!letters.includes(letter)) {
          letters.push(letter);
        }
      }

      // Vul de 3x3 grid
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.innerText = letters[i];
        
        cell.addEventListener('click', () => {
          cell.classList.toggle('marked');
        });

        grid.appendChild(cell);
      }
    }

    window.onload = generateAlphabetCard;
  </script>

</body>
</html>
