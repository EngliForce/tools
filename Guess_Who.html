<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Who?</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .font-baloo {
            font-family: 'Baloo 2', cursive;
        }

        /* 3 rows by 9 columns: exactly 27 cards fitted to screen height */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .character-card {
            background-color: #1e293b;
            border-radius: 0.5rem;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            position: relative;
            overflow: hidden;
            min-height: 0;
            height: 100%;
            padding: 3px;
        }

        .character-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
            box-shadow: 0 6px 14px -2px rgba(56, 189, 248, 0.4);
            z-index: 10;
        }

        /* Ensures the portrait card/image is fully visible without clipping or cropping */
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            border-radius: 0.35rem;
            transition: filter 0.2s ease, opacity 0.2s ease;
        }

        /* Eliminated / crossed-off status */
        .eliminated {
            border-color: #050811;
            opacity: 0.35;
            background-color: #050811;
        }
        
        .eliminated .card-image {
            filter: grayscale(100%) brightness(0.6);
        }

        .red-x-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transform: scale(0.6);
            transition: all 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .eliminated .red-x-overlay {
            opacity: 1;
            transform: scale(1);
        }

        .modal-overlay {
            backdrop-filter: blur(8px);
            background-color: rgba(11, 15, 25, 0.85);
        }
    </style>
</head>

<body>
    <!-- Top Bar with English Game Controls -->
    <header class="bg-slate-900 border-b border-slate-700 px-4 py-2.5 flex items-center justify-between shadow-md shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🕵️</span>
            <div>
                <h1 class="text-lg md:text-xl font-black font-baloo leading-none text-sky-400 m-0 tracking-wide">
                    Guess Who?
                </h1>
                <p class="text-xs text-slate-400 font-semibold hidden sm:block">
                    Click any card to cross it out. 3 rows of 9 (27 characters).
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="pickMysteryCharacter()" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-black px-3.5 py-1.5 rounded-lg shadow-sm text-xs sm:text-sm transition-transform active:scale-95 flex items-center gap-1.5 border-b-2 border-amber-600">
                <span>🎭</span>
                <span>Choose Secret Character</span>
            </button>
            <button onclick="resetBoard()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-3.5 py-1.5 rounded-lg shadow-sm text-xs sm:text-sm font-bold transition-colors active:scale-95 flex items-center gap-1">
                <span>🔄</span>
                <span>Reset</span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-2 md:p-3 overflow-hidden min-h-0 bg-slate-950 flex flex-col">
        <div id="grid-container">
            <!-- 27 character cards are generated here -->
        </div>
    </main>

    <div id="mystery-modal" class="modal-overlay fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl shadow-2xl p-5 w-80 max-w-[90vw] flex flex-col items-center text-center relative">
            <button onclick="closeMysteryModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white bg-slate-800 rounded-full p-1.5 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <span class="text-xs uppercase tracking-widest text-amber-400 font-extrabold mb-2">Your Secret Card</span>
            
            <div class="h-64 w-full bg-slate-950 rounded-xl border border-slate-700 overflow-hidden shadow-inner flex items-center justify-center p-2 my-2">
                <img id="modal-image" src="" alt="Secret Character" class="max-h-full max-w-full object-contain rounded-lg">
            </div>
            
            <p id="modal-info" class="text-sm font-semibold text-slate-400 mb-3"></p>
            
            <button onclick="closeMysteryModal()" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-2 rounded-lg text-sm shadow transition-colors">
                Got it & Close
            </button>
        </div>
    </div>

    <script>
        const cardNumbers = [];
        for (let i = 1; i <= 28; i++) {
            if (i !== 10) {
                cardNumbers.push(i);
            }
        }

        const gridContainer = document.getElementById('grid-container');

        function toggleCard(cardElement) {
            cardElement.classList.toggle('eliminated');
        }

        function renderBoard() {
            gridContainer.innerHTML = '';
            
            cardNumbers.forEach(num => {
                const card = document.createElement('div');
                card.className = "character-card shadow-md";
                card.onclick = () => toggleCard(card);

                card.innerHTML = `
                    <img src="${num}.jpg" alt="Character ${num}" class="card-image" loading="lazy" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 150%22><rect width=%22100%22 height=%22150%22 fill=%22%231e293b%22/><text x=%2250%22 y=%2275%22 fill=%22%2394a3b8%22 text-anchor=%22middle%22 font-size=%2214%22 font-family=%22sans-serif%22 font-weight=%22bold%22>${num}.jpg</text></svg>';">
                    <div class="red-x-overlay">
                        <svg class="w-4/5 h-4/5 text-red-600 drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)] p-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        function resetBoard() {
            const cards = document.querySelectorAll('.character-card');
            cards.forEach(card => card.classList.remove('eliminated'));
        }

        function pickMysteryCharacter() {
            const randomIndex = Math.floor(Math.random() * cardNumbers.length);
            const chosenNumber = cardNumbers[randomIndex];
            
            const modalImg = document.getElementById('modal-image');
            modalImg.src = `${chosenNumber}.jpg`;
            document.getElementById('modal-info').textContent = `Card #${chosenNumber}`;

            const modal = document.getElementById('mystery-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeMysteryModal() {
            const modal = document.getElementById('mystery-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMysteryModal();
        });

        document.addEventListener('DOMContentLoaded', renderBoard);
    </script>
</body>
</html>
