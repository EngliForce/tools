<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Glass Bingo</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-green: #39ff14;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh; /* Beter op mobiele browsers */
      overflow: hidden; /* Geen scrollbalken */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
    }

    /* Achtergrond neon sfeerbollen */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 40vmax;
      height: 40vmax;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.7;
    }
    body::before {
      background: var(--neon-pink);
      top: -10%;
      left: -10%;
    }
    body::after {
      background: var(--neon-cyan);
      bottom: -10%;
      right: -10%;
    }

    /* Container Glassmorphism */
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                  0 0 15px rgba(0, 243, 255, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      max-height: 96vh;
      max-height: 96dvh;
    }

    h1 {
      font-size: clamp(1.5rem, 5vh, 2.5rem);
      margin-bottom: 10px;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-cyan),
                   0 0 20px var(--neon-cyan);
    }

    /* Bingo Grid */
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      aspect-ratio: 1; /* Houdt het grid altijd perfect vierkant */
      margin-bottom: 15px;
    }

    /* Cell Styles */
    .cell {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 3.5vh, 1.4rem);
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
      line-height: 1.1;
    }

    .cell:hover:not(.marked):not(.free-space) {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      transform: scale(1.02);
    }

    /* Free Space */
    .cell.free-space {
      background: rgba(255, 0, 127, 0.15);
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      font-size: clamp(0.6rem, 2vh, 0.8rem);
      text-shadow: 0 0 6px var(--neon-pink);
      cursor: default;
      box-shadow: inset 0 0 8px rgba(255, 0, 127, 0.3);
    }

    /* Marked / Weggestreept */
    .cell.marked {
      background: rgba(57, 255, 20, 0.12);
      border-color: var(--neon-green);
      color: #fff;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
    }

    /* Neon streep door het getal */
    .cell.marked::before {
      content: '';
      position: absolute;
      width: 85%;
      height: 3px;
      background-color: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green);
      transform: rotate(-20deg);
      border-radius: 2px;
    }

    /* Klein neon checkicoontje */
    .cell.marked::after {
      content: '✓';
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: clamp(0.6rem, 1.8vh, 0.75rem);
      color: var(--neon-green);
      text-shadow: 0 0 5px var(--neon-green);
    }

    /* Reset knop */
    .btn-new {
      background: transparent;
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      padding: clamp(8px, 1.8vh, 12px) 24px;
      font-size: clamp(0.8rem, 2vh, 1rem);
      font-weight: bold;
      letter-spacing: 1.5px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn-new:hover {
      background: var(--neon-cyan);
      color: var(--bg-color);
      box-shadow: 0 0 20px var(--neon-cyan);
      text-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>BINGO</h1>
    <div class="bingo-grid" id="bingoGrid"></div>
    <button class="btn-new" onclick="generateBingoCard()">NIEUWE KAART</button>
  </div>

  <script>
    function generateBingoCard() {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = ''; // Maak het veld leeg

      // Genereer 24 unieke willekeurige getallen tussen 1 en 90
      const numbers = [];
      while (numbers.length < 24) {
        const randomNum = Math.floor(Math.random() * 90) + 1;
        if (!numbers.includes(randomNum)) {
          numbers.push(randomNum);
        }
      }

      // Vul de 5x5 grid (25 vakjes)
      let numIndex = 0;
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');

        // Middelste vakje (index 12) is de Free Space
        if (i === 12) {
          cell.classList.add('free-space');
          cell.innerText = 'FREE\nSPACE';
        } else {
          cell.innerText = numbers[numIndex];
          numIndex++;
          
          // Klik-event om het getal weg te strepen
          cell.addEventListener('click', () => {
            cell.classList.toggle('marked');
          });
        }

        grid.appendChild(cell);
      }
    }

    // Genereer direct een kaart bij het laden
    window.onload = generateBingoCard;
  </script>

</body>
</html>
