<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn kwaliteiten</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e8eef3;color:#203344}header{background:#23784d;color:white;padding:22px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,38px)}main{max-width:1000px;margin:24px auto;padding:0 18px;text-align:center}p{font-size:19px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}button{font:inherit;cursor:pointer} .word{min-height:85px;padding:12px 5px;border:2px solid #bac8d2;border-radius:12px;background:white;color:#203344;font-size:clamp(13px,2.2vw,23px);font-weight:bold;overflow-wrap:anywhere;position:relative}.word[aria-pressed=true]{background:#23784d;color:white;border-color:#195b39;box-shadow:inset 0 0 0 2px white}.word[aria-pressed=true]:after{content:'✓';position:absolute;right:7px;top:4px;font-size:14px}button:focus-visible{outline:3px solid #e89b22;outline-offset:3px}.reset{background:white;border:1px solid #8295a5;border-radius:8px;padding:12px 22px;color:#203344}.summary{margin:20px 0;min-height:55px} @media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.word{font-size:18px;min-height:65px}}</style></head><body><header><h1>Mijn kwaliteiten</h1></header><main><p>Klik op de kwaliteiten die bij jou passen. Klik nog een keer om een woord te deselecteren.</p><div class="grid" id="grid"></div><div class="summary" aria-live="polite"><strong id="count">0 kwaliteiten geselecteerd</strong><p id="chosen"></p></div><button class="reset" id="reset">Opnieuw beginnen</button></main><script>const words=['aardig','enthousiast','muzikaal','loyaal','samenwerkend','stressbestendig','behulpzaam','creatief','leergierig','sportief','sociaal','eerlijk','geduldig','doorzettend','zelfverzekerd','rustig'];const selected=new Set();const grid=document.getElementById('grid');function update(){document.getElementById('count').textContent=selected.size+' '+(selected.size===1?'kwaliteit':'kwaliteiten')+' geselecteerd';document.getElementById('chosen').textContent=words.filter(w=>selected.has(w)).join(' · ')}words.forEach(w=>{const b=document.createElement('button');b.className='word';b.textContent=w;b.setAttribute('aria-pressed','false');b.onclick=()=>{if(selected.has(w))selected.delete(w);else selected.add(w);b.setAttribute('aria-pressed',String(selected.has(w)));update()};grid.append(b)});document.getElementById('reset').onclick=()=>{selected.clear();grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));update()};</script></body></html>
